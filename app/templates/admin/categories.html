{% extends "base.html" %}{% block title %}分类管理{% endblock %}
{% block content %}<div class="page-heading"><span class="eyebrow">CATALOG SETTINGS</span><h1>分类管理</h1></div><form method="post" class="inline-fields content-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>分类名称<input name="name" required maxlength="50"></label><label>排序值<input type="number" name="sort_order" value="0"></label><button class="button button-primary">新增分类</button></form><div class="table-wrap"><table><thead><tr><th>分类名称</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody>{% for category in categories %}<tr><td>{{ category.name }}</td><td>{{ category.sort_order }}</td><td>{{ '启用' if category.is_active else '停用' }}</td><td><form method="post" action="{{ url_for('admin.toggle_category', category_id=category.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link-button">{{ '停用' if category.is_active else '启用' }}</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
