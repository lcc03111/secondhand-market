{% extends "base.html" %}{% block title %}{{ '编辑物品' if item else '发布闲置' }}{% endblock %}
{% block content %}
<div class="page-heading"><span class="eyebrow">LIST A GOOD FIND</span><h1>{{ '编辑物品' if item else '发布闲置' }}</h1><p>如实填写物品情况，帮助买家了解它。</p></div>
<form method="post" enctype="multipart/form-data" class="form-card wide-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>物品名称<input name="title" required maxlength="150" value="{{ item.title if item else '' }}"></label><label>分类<select name="category_id" required><option value="">选择分类</option>{% for category in categories %}<option value="{{ category.id }}" {% if item and item.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>价格（元）<input type="number" name="price" step="0.01" min="0.01" required value="{{ item.price if item else '' }}"></label><label>成色<select name="condition_level" required>{% for condition in conditions %}<option value="{{ condition }}" {% if item and item.condition_level == condition %}selected{% endif %}>{{ condition }}</option>{% endfor %}</select></label><label>库存数量<input type="number" name="stock_qty" min="1" max="999" value="{{ item.stock_qty if item else 1 }}" required></label><label class="full-span">物品描述<textarea name="description" rows="6" required>{{ item.description if item else '' }}</textarea></label><label class="full-span">物品图片（最多 8 张，可选）<input type="file" name="images" accept="image/png,image/jpeg,image/webp,image/gif" multiple></label></div>{% if item and item.images %}<div class="image-strip">{% for image in item.images %}<img src="{{ url_for('main.uploaded_file', filename=image.filename) }}" alt="现有图片">{% endfor %}<p class="tiny-note">图片目前采用追加方式保存。</p></div>{% endif %}<div class="form-actions"><a class="button button-outline" href="{{ url_for('market.my_items') }}">返回</a><button class="button button-primary">{{ '保存并重新审核' if item else '提交审核' }}</button></div></form>
{% endblock %}
